# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
type: dnf
repos:
  files:
    - https://copr.fedorainfracloud.org/coprs/jonathonp3/sirius-os/repo/fedora-%OS_VERSION%/jonathonp3-sirius-os-fedora-%OS_VERSION%.repo
    - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    - https://download.docker.com/linux/fedora/docker-ce.repo
install:
  packages:
    - https://mirrors.rit.edu/rpmfusion/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
    - https://mirrors.rit.edu/rpmfusion/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm
